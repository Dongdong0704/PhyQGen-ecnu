name: 缺陷报告
description: 报告可复现的问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 打开…\n2. 输入…\n3. 点击…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果及证据
      description: 可附截图、日志或样例题；请删除敏感信息。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境与版本
      placeholder: 浏览器、系统、分支或提交号
  - type: dropdown
    id: severity
    attributes:
      label: 严重程度
      options:
        - 阻断使用
        - 主要功能受影响
        - 局部功能受影响
        - 轻微问题
    validations:
      required: true
